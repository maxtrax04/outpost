<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Outpost</title>
    <meta name="description" content="A self-hosted weather dashboard">
    <meta name="theme-color" content="#071007">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/app/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Outpost">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <link id="theme" rel="stylesheet" href="themes/retro-crt.css">
</head>
<body class="theme-loading">
    <main>
        <section class="panel header">
            <div class="title">OUTPOST</div>
            <div id="subtitle" class="subtitle" hidden></div>
            <div id="location" class="location">Loading...</div>
        </section>

        <section id="alertBanner" class="panel alert">
            OUTPOST WARNING - DISPLAYING DEGRADED OR CACHED DATA
        </section>

        <section class="panel current">
            <div class="current-main">
                <div class="wx-glow"><span id="currentIcon" class="wx-icon current-icon"></span></div>
                <div>
                    <div id="temperature" class="temperature">--°F</div>
                    <div id="condition" class="condition">Waiting for signal...</div>
                </div>
            </div>

            <div class="details">
                <div class="detail-box">Feels Like<br><span id="feelsLike">--</span></div>
                <div class="detail-box">Humidity<br><span id="humidity">--</span></div>
                <div class="detail-box">Wind<br><span id="wind">--</span></div>
                <div class="detail-box">Pressure<br><span id="pressure">--</span></div>
                <div class="detail-box">UV Index<br><span id="uv">--</span></div>
                <div class="detail-box">Visibility<br><span id="visibility">--</span></div>
                <div class="detail-box">Sunrise<br><span id="sunrise">--</span></div>
                <div class="detail-box">Sunset<br><span id="sunset">--</span></div>
                <div class="detail-box">Updated<br><span id="lastUpdated">--</span></div>
            </div>
        </section>

        <section class="panel">
            <h2>FORECAST</h2>
            <div id="forecastContainer" class="forecast"></div>
        </section>

        <section id="alertsPanel" class="panel" hidden>
            <h2>ALERTS</h2>
            <div id="alerts">LOADING...</div>
        </section>

        <div id="alertsStatus" class="status-line" hidden></div>

        <footer>
            DATA: <span id="source">--</span> | OUTPOST v<span id="version">--</span> - STATUS: <span id="status">--</span>
        </footer>
    </main>

    <button id="themeButton" class="theme-button" type="button" aria-label="Change theme"
            aria-haspopup="true" aria-expanded="false" hidden>
        <svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="currentColor" stroke-width="4"
             stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
            <path d="M22 8H42L56 22V42L42 56H22L8 42V22Z"/>
            <path d="M32 8H42L56 22V42L42 56H32Z" fill="currentColor"/>
        </svg>
    </button>

    <div id="themePanel" class="theme-panel" role="menu" aria-label="Choose a theme" hidden>
        <div class="theme-panel-title">THEME</div>
        <div id="themeList"></div>
        <button id="themeReset" class="theme-reset" type="button" hidden>Use server default</button>
        <div id="themeNote" class="theme-note"></div>
    </div>

    <div id="dim-overlay"></div>

    <script src="dim.js"></script>
    <script src="themes.js"></script>
    <script src="app.js"></script>
</body>
</html>
