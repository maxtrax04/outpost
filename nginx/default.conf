# Outpost's web server. Copied into the image as /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy and other hardening headers (generated by /app/outpost_web.py).
    # A location with its own add_header loses these, so each one includes the file again.
    include /etc/nginx/outpost/security-headers.conf;

    # Weather data from the /data volume. Never let browsers cache it.
    location /data/ {
        add_header Cache-Control "no-store";
        include /etc/nginx/outpost/security-headers.conf;
    }

    # Theme files. A theme in the mounted /config/themes folder wins over a built-in theme with the
    # same name; anything it does not have comes from the built-in themes.
    # Only theme file types are served, from folders with valid theme names, and never hidden files.
    location ~ "^/themes/[a-z0-9-]+/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?:css|woff2|woff|ttf|otf|png|jpe?g|gif|webp|avif|svg)$" {
        root /config;
        try_files $uri @builtin_theme;
        # Check for changes on every load, so edits to a mounted theme show up on refresh
        add_header Cache-Control "no-cache";
        include /etc/nginx/outpost/security-headers.conf;
    }

    location @builtin_theme {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/outpost/security-headers.conf;
    }
}
