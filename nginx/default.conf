# Outpost's web server. Copied into the image as /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy and other hardening headers (generated by /app/outpost_web.py).
    # A location with its own add_header loses these, so each one includes the file again.
    include /etc/nginx/outpost/security-headers.conf;

    # The page and its scripts: browsers check for a newer copy on every load (an unchanged file
    # is a quick "not modified"). Without this, a browser may keep running old scripts with a new
    # page after an upgrade. The locations below set their own caching.
    add_header Cache-Control "no-cache";

    # Weather data from the /data volume. Never let browsers cache it.
    location /data/ {
        add_header Cache-Control "no-store";
        include /etc/nginx/outpost/security-headers.conf;
    }

    # Downloaded community themes are kept in /data/community, but served only as theme files
    # (below), never from here.
    location /data/community/ {
        return 404;
    }

    # Theme files, looked up in order: the mounted /config/themes folder, downloaded community
    # themes, then the built-in themes. A theme with the same name in an earlier place wins, and a
    # file a theme does not have (such as a variant's base theme) comes from a later place.
    # Only theme file types are served, from folders with valid theme names, and never hidden files.
    # A theme is <name>/ or, for community themes, <username>/<name>/.
    location ~ "^/themes/[a-z0-9-]+/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?:css|woff2|woff|ttf|otf|png|jpe?g|gif|webp|avif|svg)$" {
        root /config;
        try_files $uri @community_theme;
        # Check for changes on every load, so edits to a mounted theme show up on refresh
        add_header Cache-Control "no-cache";
        include /etc/nginx/outpost/security-headers.conf;
    }

    location @community_theme {
        root /data/community;
        try_files $uri @builtin_theme;
        add_header Cache-Control "no-cache";
        include /etc/nginx/outpost/security-headers.conf;
    }

    location @builtin_theme {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/outpost/security-headers.conf;
    }
}
