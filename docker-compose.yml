services:
  outpost:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outpost
    ports:
      - "${OUTPOST_WEB_PORT:-8088}:80"
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Your own themes, one folder each (see docs/themes.md). Uncomment to use.
      # - ./themes:/config/themes:ro
    restart: unless-stopped
