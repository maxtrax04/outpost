name: Release

# Publishes the Docker image to GitHub's container registry (ghcr.io).
#   - Pushing a tag like v0.3.0 publishes 0.3.0, 0.3, and latest, then creates a GitHub Release.
#   - Pushing to main publishes the "edge" tag for early testers.
#   - A version tag also publishes the Home Assistant add-on (homeassistant/) to maxtrax04/outpost-addon:
#     betas to its beta branch, released versions to its main and beta branches. This needs the
#     ADDON_REPO_TOKEN secret (a token that can push to that repository); without it, the step is skipped.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a release that is already running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Checks before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match VERSION and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file ($version)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -b
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript tests
        run: node --test
        env:
          TZ: UTC

  publish:
    name: Build and publish the image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets this x86 runner build the arm64 (Raspberry Pi) version
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Plus the labels Home Assistant's Supervisor looks for on an add-on's image
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.hass.type=addon
            io.hass.version=${{ steps.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Could not find release notes for $version in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "### Docker image"
            echo
            echo '```'
            echo "docker pull $image:$version"
            echo '```'
          } >> release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Only versions with a suffix, such as 0.4.0-beta.1, are pre-releases. A normal version
          # becomes the "Latest" release, which is what the repository's sidebar shows.
          flags="--latest"
          if [[ "$version" == *-* ]]; then
            flags="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; leaving it alone."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Outpost $version" --notes-file release-notes.md $flags
          fi

      - name: Turn this version's betas into drafts
        # Once a final version is out, its betas (v0.6.0-beta.1 and so on) leave the public Releases
        # page. They stay as drafts, which only maintainers see, and keep their tags and images.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME}-"
          gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft | not) | .tagName' |
          while read -r tag; do
            case "$tag" in
              "$prefix"*)
                gh release edit "$tag" --draft > /dev/null
                echo "$tag is now a draft"
                ;;
            esac
          done

  addon:
    name: Publish the Home Assistant add-on
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check for the add-on repository's token
        id: token
        env:
          ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          if [ -z "$ADDON_REPO_TOKEN" ]; then
            echo "::notice::ADDON_REPO_TOKEN is not set, so the Home Assistant add-on was not published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.skip != 'true'
        with:
          repository: ${{ github.repository_owner }}/outpost-addon
          token: ${{ secrets.ADDON_REPO_TOKEN }}
          path: addon-repo
          fetch-depth: 0

      - name: Publish to the beta branch, and to main for a released version
        if: steps.token.outputs.skip != 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          branches="beta"
          if [[ "$version" != *-* ]]; then
            branches="main beta"
          fi
          cd addon-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in $branches; do
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git checkout -q -B "$branch" "origin/$branch"
            else
              git checkout -q --orphan "$branch"
            fi
            python3 ../scripts/publish_addon.py "$version" .
            git add -A
            if git diff --cached --quiet; then
              echo "The add-on on $branch is already $version"
            else
              git commit -q -m "Outpost $version"
              git push -q origin "$branch"
              echo "Published the add-on $version to $branch"
            fi
          done
